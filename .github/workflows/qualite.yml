name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Les tests ne touchent jamais le réseau : rien à mettre en cache côté site cible.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check src tests tools

      - name: Format (ruff)
        run: uv run ruff format --check src tests tools

      - name: Typage strict (mypy)
        run: uv run mypy

      - name: Tests + couverture
        run: uv run pytest --cov --cov-report=term-missing

      - name: Aucune donnée personnelle dans les fixtures
        run: uv run python tools/check_fixtures.py

      - name: La configuration livrée est valide
        run: uv run sleeper valider-config

  # Contrôles de dérive : ils comparent des fichiers générés à ceux du dépôt.
  # Inutile de les rejouer sur six combinaisons, et surtout : la redirection
  # « > » de PowerShell écrit en UTF-16, et git peut normaliser les fins de
  # ligne sur Windows. Ces deux pièges rendraient la comparaison fausse.
  derive:
    name: Artefacts générés à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Le schéma publié suit les modèles
        run: |
          uv run sleeper schema
          git diff --exit-code schemas/

      - name: La doc des règles métier suit le code
        run: |
          uv run python tools/generate_rules_doc.py > docs/regles-metier.md
          git diff --exit-code docs/
