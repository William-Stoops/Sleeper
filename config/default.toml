# Configuration de reference de Sleeper.
#
# Tout ce qui est metier vit ici : rien n'est en dur dans le code.
# Le fichier est valide au demarrage ; une erreur arrete l'outil avec un
# message explicite, plutot que de produire un scan silencieusement vide.
#
# Copier ce fichier et le passer a la CLI :  sleeper collecter -c mon.toml

# ---------------------------------------------------------------------------
[reseau]
# ---------------------------------------------------------------------------
base_url = "https://encheres-domaine.gouv.fr"

# Le robot doit etre identifiable : une adresse de contact ou une URL est
# EXIGEE. Remplacer par une adresse reellement relevee.
#
# Cette chaine n'ecrase PAS le User-Agent du navigateur — ce serait un
# deguisement. Elle voyage a cote, dans l'en-tete « From » (RFC 9110, adresse
# de la personne responsable d'un agent automatise) et dans
# « X-Robot-Identification ».
user_agent = "SleeperBot/0.1 (+mailto:contact@exemple.fr)"

# Politesse. Le site est un service public protege par un WAF : une seule
# execution par jour, et un delai entre chaque requete.
#
# Il n'y a pas de reglage de concurrence : les requetes partent en sequence.
# Le transport est un navigateur, dont l'API synchrone est mono-thread, et une
# limite de debit globale est de toute facon une garantie plus stricte qu'un
# plafond de requetes simultanees.
# Plancher impose par le code : delai >= 0.5 s.
delai_entre_requetes_s = 1.5

# Transport.
timeout_s = 30.0
tentatives_max = 4
backoff_initial_s = 1.0
backoff_facteur = 2.0
backoff_max_s = 30.0

# Duree de validite d'une session navigateur avant renouvellement.
session_ttl_minutes = 45

# Le navigateur s'ouvre VISIBLEMENT, une fois par execution, le temps d'obtenir
# la session (quelques secondes). Ce n'est pas un confort de debogage : en mode
# headless, Chromium annonce « HeadlessChrome » dans son User-Agent, et le
# pare-feu du site sert alors un CAPTCHA. Masquer ce jeton serait un
# deguisement ; on ouvre donc un vrai navigateur.
# Sur un serveur sans affichage, passer par xvfb (voir README).
navigateur_headless = false

# ---------------------------------------------------------------------------
[perimetre]
# ---------------------------------------------------------------------------
# Ce qui compte est le LIEU DE RETRAIT du lot, jamais le siege de la vente.
# Un lot hors perimetre n'est pas supprime : il est marque `hors_perimetre`
# et conserve dans la sortie.
#
# Departements a 5 h de route de Lille.
departements = [
  "02", "08", "10", "14", "18", "21", "25", "27", "28", "35",
  "36", "37", "41", "45", "49", "50", "51", "52", "53", "54",
  "55", "57", "58", "59", "60", "61", "62", "67", "68", "70",
  "72", "75", "76", "77", "78", "80", "86", "88", "89", "90",
  "91", "92", "93", "94", "95",
]

# La source ne publie pas de code pays : l'etranger est detecte sur le libelle
# du lieu de retrait (« BRUXELLES (BELGIQUE) »). Codes ISO-3166 alpha-2.
pays_etrangers = ["BE", "LU"]

# ---------------------------------------------------------------------------
[exclusions]
# ---------------------------------------------------------------------------
# Liste vide = toutes les regles sont actives. Restreindre ici pour un
# diagnostic, en sachant que les lots concernes remonteront alors dans la
# sortie principale.
#
# Regles disponibles :
#   hors_categorie_vehicule, genre_hors_cible, collection_avant_1990,
#   sans_cle, sans_certificat_immatriculation, epave_ou_pieces, non_roulant,
#   moteur_hors_service, choc_ou_accident, gage_ou_opposition,
#   kilometrage_inconnu
regles_actives = []

# Enrichissement des formulations reconnues. Ajouter ici toute tournure
# rencontree sur le terrain et non couverte ; voir docs/regles-metier.md.
# Une cle inconnue fait echouer le demarrage : pas de regle morte silencieuse.
[exclusions.formulations_supplementaires]
# moteur_hors_service = ["bloc moteur fendu", "turbo a remplacer"]
# choc_ou_accident = ["pare-chocs arrache"]

# ---------------------------------------------------------------------------
[filtres]
# ---------------------------------------------------------------------------
# Categorie de vente balayee, telle qu'elle est libellee par la source.
categorie_vehicules = "Véhicules"

# Statuts de vente retenus : 2 = a venir, 3 = en cours.
statuts_vente = [2, 3]

# Segments commerciaux travailles : vl (vehicule leger), vu (utilitaire),
# pl (poids lourd), engin (non immatriculable).
#
# Un lot hors de ces segments n'est PAS ecarte : il reste dans la sortie, son
# segment affiche, et il quitte simplement le classement. Une decision
# commerciale est une ligne de configuration, jamais un filtre.
segments_actifs = ["vl", "vu"]

# Taille de page demandee a l'API, pour la liste des ventes comme pour celle
# des lots. La valeur employee par l'application du site est 8 ; s'en ecarter
# fait sortir la requete du gabarit accepte par le pare-feu applicatif.
# Ne pas augmenter sans avoir rejoue la decouverte.
taille_de_page = 8

# ---------------------------------------------------------------------------
[frais]
# ---------------------------------------------------------------------------
# Frais acheteur. C'est de ce taux que depend tout calcul de plafond
# d'enchere en aval.
#
# La source ne les publie presque jamais : sur le run du 25/08, un seul lot
# sur 338 annoncait son taux. Le repli est donc la norme, pas l'exception.
#
# Il est pris HAUT, et delibrement : sous-estimer les frais gonfle le plafond
# d'enchere, ce qui est l'erreur couteuse. Les surestimer ne coute qu'un lot
# manque. 14,4 % TTC = 12 % HT majore de la TVA.
defaut_pct = 14.4

# Taux connus, par identifiant de vente. Ce qui est renseigne ici n'est PAS
# publie par la source : le lot porte alors frais_acheteur_source = "config"
# et frais_hypothetiques = true, visibles jusque dans le digest.
[frais.par_vente]
# "474" = 11.0

# ---------------------------------------------------------------------------
[score]
# ---------------------------------------------------------------------------
# CE N'EST PAS UNE COTATION, C'EST UN TRI.
#
# Il est grossier, rapide, entierement deterministe, explicable ligne a ligne
# et volontairement conservateur : mieux vaut faire remonter un lot mediocre
# que d'en enterrer un bon. Il ne decide d'aucun achat. Il decide seulement de
# qui recoit l'analyse couteuse.
#
# La calibration de config/cotes.csv est la principale dette du projet : ses
# valeurs sont une amorce, pas une verite.

table_cotes = "config/cotes.csv"
table_reparations = "config/reparations.csv"

# Combien de lots recoivent l'analyse couteuse.
a_coter_n = 25

# Un lot que la table de cotes ne connait pas et qui part sous ce seuil est
# remonte quand meme : rare, mal catalogue et sous-evalue est exactement le
# profil recherche.
seuil_sans_cote_eur = 2000.0

# La remise en etat est plafonnee a cette part de la cote ; au-dela, le lot est
# marque non reparable economiquement.
plafond_reparations_ratio = 0.6

# Coefficients. Aucun n'est en dur dans le code.
#
# Le 1,20 des lots professionnels traduit un fait de marche : la moitie des
# encherisseurs en est ecartee d'office, donc le prix d'adjudication decroche
# mecaniquement de la cote.
reserve_aux_professionnels = 1.20
ct_favorable_recent = 1.10
faible_km_par_an = 1.15
seuil_km_par_an = 8000
dommages_structurels = 0.75
gravite_signal = 0.85
gravite_lourd = 0.70
gravite_redhibitoire = 0.30
non_reparable = 0.10
perimetre_hors = 0.0
perimetre_inconnu = 1.0
segment_inactif = 0.0

# ---------------------------------------------------------------------------
[sortie]
# ---------------------------------------------------------------------------
# CHEMINS SOUS WINDOWS : dans une chaine TOML entre guillemets, « \ » ouvre une
# sequence d'echappement, et « C:\Users\... » echoue sur « Invalid hex value ».
# Ecrire « C:/Users/... » avec des barres obliques, ou 'C:\Users\...' entre
# apostrophes simples, qui n'echappent rien.
repertoire = "var/sorties"
nom_lien_courant = "latest.json"
digest = true
nom_digest = "latest.md"

# Depot du JSON classe sur Google Drive, pour le systeme d'analyse aval.
# C'est ce « latest.json » qu'il vient lire chaque jour.
#
# Le fichier de compte de service N'ENTRE JAMAIS DANS LE DEPOT : seul son
# chemin est ici, et le fichier lui-meme est dans .gitignore.
#
# Un echec de depot ne fait pas echouer le run : le fichier local reste ecrit
# et reste la source, et l'erreur remonte dans run.erreurs.
[sortie.drive]
actif = false
credentials = "config/drive-service-account.json"
dossier_id = ""

# ---------------------------------------------------------------------------
[etat]
# ---------------------------------------------------------------------------
# Base SQLite : detection des nouveautes, historique des encheres, cache.
base = "var/etat/sleeper.sqlite3"
conserver_historique_encheres = true

# ---------------------------------------------------------------------------
[journalisation]
# ---------------------------------------------------------------------------
# niveau : DEBUG, INFO, WARNING, ERROR, CRITICAL
# format : "json" pour la tache planifiee, "console" pour le confort humain
niveau = "INFO"
format = "json"
