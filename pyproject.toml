[project]
name = "sleeper"
version = "0.1.0"
description = "Collecteur des ventes de vehicules d'encheres-domaine.gouv.fr"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "jsonschema>=4.23",
    "playwright>=1.49",
    "pydantic>=2.9",
    "rich>=13.9",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.scripts]
sleeper = "sleeper.cli:app"

[project.optional-dependencies]
# Dépôt du JSON classé sur Google Drive, pour le système d'analyse aval.
# Optionnel : une machine qui ne publie pas n'a pas à installer ces paquets.
# google-auth-oauthlib : un compte de service n'a pas de quota de stockage,
# donc sur un compte Google personnel seule l'autorisation OAuth permet
# d'écrire. C'est la bibliothèque officielle du consentement navigateur.
drive = [
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper"]

[tool.hatch.build.targets.wheel.force-include]
"src/sleeper/py.typed" = "sleeper/py.typed"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "N",                # pep8-naming
    "UP",               # pyupgrade
    "B",                # bugbear
    "C4",               # comprehensions
    "SIM",              # simplify
    "PTH",              # pathlib
    "RET",              # returns
    "ARG",              # unused arguments
    "TID",              # tidy imports
    "PL",               # pylint subset
    "RUF",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
# Embedded Markdown template: the table width is not negotiable.
"tools/generate_rules_doc.py" = ["E501"]
# Le digest est du français rendu : « × » y est le signe multiplié, pas un x.
"src/sleeper/output/digest.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

# Les bibliothèques Google ne publient pas de stubs et vivent dans un extra :
# une machine qui ne dépose pas sur Drive ne les installe pas.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.oauth2.*",
    "google.auth.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true

# google-auth n'expose aucune annotation : appeler ses constructeurs depuis un
# module typé déclenche disallow_untyped_calls. La levée est cantonnée au seul
# module qui les appelle, et rien d'autre n'y est relâché.
[[tool.mypy.overrides]]
module = "sleeper.output.drive"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["discovery: touche le reseau, exclu du run par defaut"]

[tool.coverage.run]
source = ["src/sleeper"]
branch = true

[tool.coverage.report]
# Le plancher protege le domaine metier, la ou une regression est couteuse.
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$", "raise NotImplementedError"]
